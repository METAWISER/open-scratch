name: Bug report
description: Report a reproducible problem without secrets.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Read SECURITY.md for vulnerabilities. Do not post sensitive details."
  - type: input
    id: environment
    attributes:
      label: OpenScratch version and operating system
      placeholder: "0.3.0, Windows 11 x64, Python / .NET SDK version if relevant"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal snippet without private data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
