name: Feature or improvement
description: Suggest a feature, language, learning guide, or accessibility improvement.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and alternatives
      description: Include reliable references for guides and editor/runtime needs for languages.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Optional participation
      options:
        - label: I would like to help implement this
